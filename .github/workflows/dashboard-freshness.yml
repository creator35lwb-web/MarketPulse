name: Dashboard Freshness Watchdog

# Repository publication is distinct from Telegram delivery and Pages availability.
# A publication push reconciles late updates immediately; hourly checks also
# recover when a scheduled job or publication event is delayed. The script uses
# elapsed UTC deadlines, including CN weekdays, rather than the runner's date.
on:
  push:
    branches: [main]
    paths:
      - 'docs/data/latest-us.json'
      - 'docs/data/latest-cn.json'
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Observe only: no issue changes or Telegram messages'
        type: boolean
        default: true
      validate_telegram:
        description: 'Check Telegram token/channel read access only; no issue changes or messages'
        type: boolean
        default: false

permissions:
  contents: read

# Serialize push and scheduled reconciliation so overlapping checks cannot create
# duplicate alerts. Always check the current trusted branch, even for queued jobs.
concurrency:
  group: dashboard-freshness-${{ github.repository }}
  cancel-in-progress: false

jobs:
  freshness:
    if: github.ref == 'refs/heads/main'
    name: Check dashboard repository publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Test freshness dates and issue reconciliation offline
        run: node --test tests/dashboard-freshness.test.mjs

      - name: Observe publication and reconcile matching alerts
        run: node .github/scripts/check-freshness.mjs --reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FRESHNESS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          FRESHNESS_VALIDATE_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_telegram || false }}
