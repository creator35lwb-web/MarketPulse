name: Dashboard Freshness Watchdog

# Why this exists:
# The digest runs on a self-hosted n8n on the operator's personal laptop, which is often
# offline. A watchdog on that laptop cannot report the laptop being offline — a thing cannot
# monitor its own absence. This job runs on GitHub Actions (always on, OFF the laptop) and
# checks the one artifact a successful run leaves behind: the `generatedAt` timestamp in the
# published dashboard JSON. If today's run did not land, it opens a GitHub Issue — which
# notifies the operator on any device (incl. iPad) via the GitHub app / email.
#
# Deliberate design (matches this repo's existing alarm philosophy):
#   • The job NEVER goes red on a missing digest. A build that is red on every offline day
#     trains the operator to ignore CI. The alarm is an Issue, not a red build.
#   • Each edition is checked right after ITS OWN publish window, so "did today's run land?"
#     is exactly the right question. The CN check runs Mon–Fri only, so weekends (when CN
#     legitimately does not publish) cannot raise a false alarm.
#   • No secrets, no webhook URLs in the issue body — this repo is public. Manual recovery is
#     the operator's saved private trigger shortcut, referenced but never printed here.
#
# Third-party actions are pinned to an immutable commit SHA, never a floating tag.

on:
  schedule:
    - cron: '0 14 * * *'      # US edition: ~1h after the 13:00 UTC publish window
    - cron: '30 9 * * 1-5'    # CN edition: ~1h after the 08:30 UTC weekday publish window
  workflow_dispatch:          # manual run — checks both editions
    inputs:
      dry_run:
        description: 'Check freshness and log the result, but do NOT open an issue'
        type: boolean
        default: false
      validate_telegram:
        description: 'Validate the TELEGRAM_BOT_TOKEN secret (getMe + getChat only — sends NO message)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    name: is today's digest published?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: check
        name: Check published dashboard freshness
        run: node .github/scripts/check-freshness.mjs
        env:
          SCHEDULE: ${{ github.event.schedule }}

      - name: Open an alert issue if a digest is missing
        id: issue
        if: steps.check.outputs.alert == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITIONS: ${{ steps.check.outputs.editions }}
          TODAY: ${{ steps.check.outputs.today }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          TITLE="⚠️ MarketPulse digest missing — ${EDITIONS} — ${TODAY}"
          EXISTING=$(gh issue list --state open --json title,number \
            --jq ".[] | select(.title==\"${TITLE}\") | .number")
          if [ -n "${EXISTING}" ]; then
            echo "An alert issue is already open (#${EXISTING}) — not duplicating."
            exit 0
          fi
          BODY=$(cat <<EOF
          Today's MarketPulse digest did not publish for: **${EDITIONS}**.

          ${SUMMARY}

          **Most likely cause:** the laptop hosting n8n was offline (asleep or powered off) at
          the scheduled trigger time, so the run never fired. The digest has no automatic
          catch-up by design — recovery is one manual trigger.

          **What to do:** trigger the digest from your saved private shortcut (the manual
          webhook). Once it publishes, this alert can be closed — it will not reopen until a
          future run is missed.

          _Filed automatically by the Dashboard Freshness Watchdog. This check runs off the
          laptop, so it can see an outage the laptop itself cannot report._
          EOF
          )
          gh issue create --title "${TITLE}" --body "${BODY}"
          echo "Opened alert issue: ${TITLE}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Presence when absent: subscribers hear "no digest today" even with the host fully off.
      # Runs only when a NEW alert issue was just opened (same dedupe as the issue itself), and
      # never fails the build — the Issue above stays the primary alert if Telegram is down.
      # Requires the TELEGRAM_BOT_TOKEN repo secret; silently skips until it is configured.
      - name: Announce the missed digest on Telegram
        if: steps.issue.outputs.created == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EDITIONS: ${{ steps.check.outputs.editions }}
          TODAY: ${{ steps.check.outputs.today }}
        run: |
          if [ -z "${TG_TOKEN}" ]; then
            echo "TELEGRAM_BOT_TOKEN secret not set — skipping the Telegram announcement."
            exit 0
          fi
          # Paste-proof the secret: stray spaces/newlines in the stored value would
          # otherwise malform the request URL (curl exit 3), and a pasted-in leading
          # "bot" prefix would double up (the URL below adds its own).
          TG_TOKEN=$(printf '%s' "${TG_TOKEN}" | tr -d '[:space:]')
          case "${TG_TOKEN}" in
            [Bb][Oo][Tt][0-9]*:*) TG_TOKEN="${TG_TOKEN#[Bb][Oo][Tt]}" ;;
          esac
          TEXT="📡 <b>MarketPulse status — ${TODAY}</b>

          Today's ${EDITIONS} digest did not publish — the host machine is offline (or the market is closed and the operator is away).

          No stale data was sent: when a run can't verify fresh numbers, it publishes nothing. The last verified digest remains on the dashboard:
          https://creator35lwb-web.github.io/MarketPulse/

          Service resumes with the next scheduled run."
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=@n8nMarketPulse" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true")
          if [ "${HTTP}" = "200" ]; then
            echo "Telegram status announcement sent."
          else
            echo "Telegram send failed (HTTP ${HTTP}) — the GitHub Issue remains the primary alert."
          fi

      # ===== LATE-vs-MISSING RESOLUTION (2026-07-30) =====
      # A digest that is merely LATE is indistinguishable from a MISSING one at check time, so
      # on 2026-07-30 the channel was told the CN digest was missing at 19:29 MYT and received
      # it at 20:08. Detecting fast is correct; leaving the warning hanging is not. When an
      # edition is fresh and an alert this watchdog opened is still open, retire it here.
      #
      # Only an alert whose title names EXACTLY this edition ("— CN —") is closed. A combined
      # "US + CN" alert is deliberately left open: one edition recovering does not clear both.
      - name: Retire any open alert once the digest lands
        id: resolve
        if: steps.check.outputs.fresh == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRESH_EDITIONS: ${{ steps.check.outputs.fresh_editions }}
          FRESH_SUMMARY: ${{ steps.check.outputs.fresh_summary }}
        run: |
          CLOSED=""
          for ED in ${FRESH_EDITIONS}; do
            NUMS=$(gh issue list --state open --limit 30 --json title,number \
              --jq ".[] | select(.title | contains(\"MarketPulse digest missing\") and contains(\" — ${ED} — \")) | .number")
            for N in ${NUMS}; do
              gh issue close "${N}" --comment "✅ **Resolved automatically — the ${ED} digest has published.**

          ${FRESH_SUMMARY}

          This alert was filed when the digest had not yet appeared. It has now landed, so the
          run was **late rather than missing** — the host was offline at the scheduled hour and
          completed once it came back. No stale data was published in the interval: a run that
          cannot verify fresh numbers publishes nothing.

          _Retired by the Dashboard Freshness Watchdog._"
              echo "Closed alert issue #${N} (${ED} digest landed)."
              CLOSED="${CLOSED} ${ED}#${N}"
            done
          done
          if [ -n "${CLOSED}" ]; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
            echo "resolved_editions=$(echo ${FRESH_EDITIONS})" >> "$GITHUB_OUTPUT"
          else
            echo "No open alert to retire — nothing was announced for these editions."
          fi

      # Close the story in the channel too. Fires ONLY when an alert was actually retired,
      # which means subscribers previously saw a missing-digest warning that now needs an
      # ending. Never fails the build; the Issue comment above is the durable record.
      - name: Announce the late arrival on Telegram
        if: steps.resolve.outputs.resolved == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EDITIONS: ${{ steps.resolve.outputs.resolved_editions }}
          TODAY: ${{ steps.check.outputs.today }}
        run: |
          if [ -z "${TG_TOKEN}" ]; then
            echo "TELEGRAM_BOT_TOKEN secret not set — skipping the resolution announcement."
            exit 0
          fi
          # Paste-proof the secret exactly as the announce step does.
          TG_TOKEN=$(printf '%s' "${TG_TOKEN}" | tr -d '[:space:]')
          case "${TG_TOKEN}" in
            [Bb][Oo][Tt][0-9]*:*) TG_TOKEN="${TG_TOKEN#[Bb][Oo][Tt]}" ;;
          esac
          TEXT="✅ <b>MarketPulse status — resolved — ${TODAY}</b>

          The ${EDITIONS} digest we reported as missing earlier today has now published — it was <b>late, not skipped</b>. The host machine was offline at the scheduled hour and the run completed once it came back.

          Nothing stale was published in between: a run that cannot verify fresh numbers publishes nothing at all.

          🔗 https://creator35lwb-web.github.io/MarketPulse/"
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=@n8nMarketPulse" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true")
          if [ "${HTTP}" = "200" ]; then
            echo "Telegram resolution announcement sent."
          else
            echo "Telegram send failed (HTTP ${HTTP}) — the closed Issue remains the record."
          fi

      # Manual-only validation of the announcement path WITHOUT posting anything:
      # getMe proves the token is valid; getChat proves the bot can see the channel.
      # Responses are reduced to ok/username/title — the token itself is never echoed.
      - name: Validate Telegram credentials (no message sent)
        if: github.event.inputs.validate_telegram == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "${TG_TOKEN}" ]; then
            echo "FAIL: TELEGRAM_BOT_TOKEN secret is not set."
            exit 1
          fi
          # Paste-proof the secret (see announce step). Report shape only — never the value.
          RAW_LEN=${#TG_TOKEN}
          TG_TOKEN=$(printf '%s' "${TG_TOKEN}" | tr -d '[:space:]')
          [ "${RAW_LEN}" -ne "${#TG_TOKEN}" ] && echo "note: stripped $((RAW_LEN - ${#TG_TOKEN})) whitespace char(s) from the stored secret — consider re-saving it clean."
          case "${TG_TOKEN}" in
            [Bb][Oo][Tt][0-9]*:*)
              TG_TOKEN="${TG_TOKEN#[Bb][Oo][Tt]}"
              echo "note: stripped a leading 'bot' prefix from the stored secret — the URL adds its own; consider re-saving just the token."
              ;;
          esac
          case "${TG_TOKEN}" in
            *:*) : ;;
            *) echo "warn: secret does not look like a bot token (no ':' present)." ;;
          esac
          ME=$(curl -s "https://api.telegram.org/bot${TG_TOKEN}/getMe" || echo '{"ok":"curl-failed"}')
          echo "getMe ok: $(echo "${ME}" | jq -r '.ok') — bot: $(echo "${ME}" | jq -r '.result.username // "n/a"')"
          CHAT=$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/getChat" \
            --data-urlencode "chat_id=@n8nMarketPulse")
          echo "getChat ok: $(echo "${CHAT}" | jq -r '.ok') — channel: $(echo "${CHAT}" | jq -r '.result.title // "n/a"')"
          [ "$(echo "${ME}" | jq -r '.ok')" = "true" ] && [ "$(echo "${CHAT}" | jq -r '.ok')" = "true" ] \
            && echo "VALIDATED: the watchdog can announce to the channel." \
            || { echo "FAIL: token or channel access is not working."; exit 1; }
