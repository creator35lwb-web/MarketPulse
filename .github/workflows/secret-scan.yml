name: Secret Scan

# Why this exists:
# This repo is PUBLIC and maintained by a solo builder — there is no second pair of eyes
# on a commit. This is that second pair of eyes.
#
# Division of labour, deliberately:
#   • GitHub native secret scanning + push protection  -> KNOWN PROVIDER patterns, and it
#     scans full history. It works: it caught a Google API key here on 2026-02-09, the same
#     day it was committed, and that key is recorded as revoked.
#   • gitleaks (this job)                              -> everything GitHub's provider list
#     MISSES: generic/custom keys, bare hex API keys, project-specific tokens. It scans the
#     working tree and the incoming diff, so a new leak is caught before it can spread.
#
# History is covered by GitHub's scanner (above), so this job deliberately does NOT rescan
# it — that would only re-surface the one known, already-revoked historical finding and
# leave the build permanently red, which trains everyone to ignore a red build. An alarm
# nobody trusts is worse than no alarm.
#
# Third-party actions are pinned to an immutable commit SHA, never a floating tag — a tag
# can be silently re-pointed at malicious code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
