# MarketPulse HTTPS deployment template. Validate configuration before deployment.
# Container startup, certificates and n8n 2.38.5 migrations require operator testing.

services:
  # ============================================
  # TRAEFIK REVERSE PROXY
  # Handles SSL termination, rate limiting, security headers
  # ============================================
  traefik:
    image: traefik:v3.7.12  # Pinned template target; requires runtime verification.
    container_name: marketpulse-traefik
    restart: unless-stopped
    # Use one static configuration method. Compose expands ACME_EMAIL here;
    # Traefik does not expand ${...} placeholders in a mounted static YAML file.
    command:
      - --api.dashboard=false
      - --api.insecure=false
      - --ping=true
      - --log.level=WARN
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.filters.statuscodes=400-599
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=30s
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=30s
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=180s
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=marketpulse-network
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme.json
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - marketpulse-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # N8N WORKFLOW ENGINE
  # Security-hardened configuration
  # ============================================
  n8n:
    image: n8nio/n8n:2.38.5  # Pinned target; validate migrations and runtime before upgrading.
    container_name: marketpulse-n8n
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Basic Configuration
      - N8N_HOST=${DOMAIN:?Set DOMAIN in .env}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_WEBHOOK_URL=https://${DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://${DOMAIN}/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Kuala_Lumpur}
      - TZ=${TIMEZONE:-Asia/Kuala_Lumpur}

      # Initialize the owner account through n8n before opening public access.
      # N8N_BASIC_AUTH_* was removed in n8n 1.0 and must not be used here.

      # Encryption (REQUIRED)
      - N8N_ENCRYPTION_KEY_FILE=/run/secrets/n8n_encryption_key
      - N8N_USER_MANAGEMENT_JWT_SECRET_FILE=/run/secrets/n8n_jwt_secret

      # Security Settings
      - N8N_SECURITY_AUDIT_DAYS_ABANDONED_WORKFLOW=90
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true

      # Execution Settings
      - EXECUTIONS_MODE=regular
      - EXECUTIONS_TIMEOUT=300
      - EXECUTIONS_TIMEOUT_MAX=600
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168  # 7 days

      # Logging
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console

      # Memory Optimization
      - NODE_OPTIONS=--max-old-space-size=512

      # Disable Telemetry (Privacy)
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    secrets:
      - n8n_encryption_key
      - n8n_jwt_secret
    volumes:
      - n8n-data:/home/node/.n8n
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    networks:
      - marketpulse-network
    depends_on:
      traefik:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "traefik.enable=true"
      # HTTPS Router
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n.service=n8n"
      - "traefik.http.routers.n8n.middlewares=secure-chain@file"
      # Service
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ============================================
# NETWORKS
# ============================================
networks:
  marketpulse-network:
    name: marketpulse-network
    driver: bridge

# ============================================
# VOLUMES
# ============================================
volumes:
  n8n-data:
    driver: local

# ============================================
# SECRETS
# ============================================
secrets:
  n8n_encryption_key:
    file: ./secrets/n8n_encryption_key
  n8n_jwt_secret:
    file: ./secrets/n8n_jwt_secret
